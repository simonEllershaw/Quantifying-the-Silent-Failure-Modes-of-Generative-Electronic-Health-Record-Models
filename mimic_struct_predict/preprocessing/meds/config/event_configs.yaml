hosp/procedures_icd:
  procedure:
    code:
      - Hospital Procedure
      - col(long_title) # Instead of ICD code + version
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"

hosp/transfers:
  # Split into 2 events (grouped later)
  transfer_to:
    code:
      - Hospital Transfer
      - To
      - col(careunit)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  transfer_type:
    code:
      - Hospital Transfer
      - Type
      - col(eventtype)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"

