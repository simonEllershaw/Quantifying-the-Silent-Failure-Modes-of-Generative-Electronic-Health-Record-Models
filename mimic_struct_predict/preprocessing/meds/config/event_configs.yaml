### ED Tables (not in MEDS-MIMIC config) ###

ed/diagnosis:
  # Same format as hosp/diagnoses_icd
  diagnosis:
    code:
      - ED Diagnosis
      - col(long_title) # Joined from hosp/d_icd_diagnoses (icd_code + icd_version -> long_title)
    time: col(outtime) # Joined from ed/edstays
    time_format: "%Y-%m-%d %H:%M:%S"

ed/edstays:
  ed_registration_arrival:
    code:
      - ED Admission
      - Arrival Method
      - col(arrival_transport)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  # Same format as hosp/admissions/admission_race etc
  ed_registration_race:
    code:
      - ED Admission
      - Race
      - col(race)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  ed_registration_gender:
    code:
      - ED Admission
      - Gender
      - col(gender)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
  ed_registration_age:
     code:
       - ED Admission
       - Age
     numeric_value: col(age) # Calculated from hosp/patients anchor_age and anchor_year
     time: col(intime)
     time_format: "%Y-%m-%d %H:%M:%S"
  ed_out:
    # Same format as Hospital Discharge
    code:
      - ED Discharge
      - Location
      - col(disposition)
    time: col(outtime)
    time_format: "%Y-%m-%d %H:%M:%S"

ed/medrecon:
  medication:
    code:
      - Home Medication
      - col(name)
    time: col(intime) # Use intime instead of chartime so better grouping
    time_format: "%Y-%m-%d %H:%M:%S"

ed/pyxis:
  medication:
    # Same format as hosp/emar but no event_txt in this table
    code:
      - "ED Medication: Name, Details"
      - col(name)
      - Administered
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"

ed/triage:
  triage:
    code:
      - "ED Triage: Name, Unit, Value"
      - col(name)
      - col(unit)
      # HACK: Same as hosp/labevents
      - col(value)
    numeric_value: col(value_num)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"

ed/vitalsign:
  # Cols not used: rhythm (implict as dropped in premeds, for reasoning see process_ed_vitals_df)
  vital_sign:
    code:
      - "ED Vital Sign: Name, Unit, Value"
      - col(name)
      - col(unit)
      # HACK: Same as hosp/labevents
      - col(value)
    numeric_value: col(value_num)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
