metadata:
  description: >-
    True if patient dies during hospital stay, false otherwise.
    Prediction is made at 24 hours after hospital admission, and only includes patients who survive until this point discharge.

predicates:
  hospital_admission:
    code: "####//Hospital Admission"
  hospital_discharge:
    code: "####//Hospital Discharge"
  death:
    code: "####//Death"

trigger: hospital_admission

windows:
  input:
    # All of patients history up until hospital admission + 24 hours
    start: NULL
    end: trigger + 24 hours
    start_inclusive: True
    end_inclusive: True
    index_timestamp: end
  gap:
    # Drop events where patient dies before hospital admission + 24 hours
    start: NULL
    end: input.end
    start_inclusive: False
    end_inclusive: True
    has:
      death: (None, 0)
  target:
    # True if patient dies during hospital stay, false otherwise
    start: input.end
    end: start -> hospital_discharge
    start_inclusive: False
    end_inclusive: True
    label: death
