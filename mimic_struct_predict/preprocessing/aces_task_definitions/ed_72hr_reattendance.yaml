metadata:
  description: >-
    True if patient reattends the ED within 72 hours of ED discharge, false otherwise.
    Prediction is made at ED discharge, and only includes patients who survive until ED discharge.

predicates:
  ed_registration:
    code: "####//ED Admission"
  ed_discharge:
    code: "####//ED Discharge"
  death:
    code: "####//Death"

trigger: ed_discharge

windows:
  input:
    # All of patients history up until ED discharge
    start: NULL
    end: trigger
    start_inclusive: True
    end_inclusive: True
    index_timestamp: end
  gap:
    # Drop events where patient dies before ED discharge
    start: NULL
    end: trigger
    start_inclusive: False
    end_inclusive: True
    has:
      death: (None, 0)
  target:
    # True if re-attendance to ED 72 hours after ED discharge, false otherwise
    start: gap.end
    end: start + 72 hours
    start_inclusive: False
    end_inclusive: True
    label: ed_registration
